name: scan2
description: "Scanella — an offline document scanner with live edge detection, auto-capture, perspective correction and scan filters."
publish_to: 'none'
version: 1.5.103+865

environment:
  sdk: '^3.12.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Storage
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2

  # Camera and imaging
  camera: ^0.11.0+1
  image_picker: ^1.1.2
  image: ^4.3.0
  cunning_document_scanner: ^1.2.3

  # Export and share
  pdf: ^3.11.1
  share_plus: ^10.0.2

  # Importing pages that were never photographed here: a PDF someone mailed
  # you, a scan already sitting in Files.
  file_picker: ^8.1.2
  printing: ^5.13.1

  # Utilities
  intl: ^0.19.0
  permission_handler: ^11.3.1
  gal: ^2.3.3
  crypto: ^3.0.6
  package_info_plus: ^8.1.2
  local_auth: ^2.3.0
  in_app_purchase: ^3.2.3
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  test: ^1.25.2

flutter:
  uses-material-design: true
  assets:
    - assets/brand/app_mark.png

  fonts:
    # Plus Jakarta Sans (SIL Open Font License 1.1) — see assets/fonts/OFL.txt.
    # Bundled rather than fetched at runtime so the first frame is already on
    # brand: a font that arrives a beat late shows the customer the stock
    # system face first, which is the exact impression the face is here to fix.
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
